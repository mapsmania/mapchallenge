<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bernina Switchbacks — Three.js + Mapterhorn + MapLibre Inset</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #101820; font-family: system-ui, sans-serif; color: #fff; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      background: rgba(15, 23, 32, 0.84); backdrop-filter: blur(8px);
      padding: 14px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14);
      max-width: 320px; font-size: 13px; line-height: 1.45;
    }
    #hud h1 { font-size: 15px; margin-bottom: 6px; color: #7dd3fc; }
    #status { color: #cbd5e1; margin-bottom: 10px; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button {
      background: #0284c7; color: #fff; border: none; border-radius: 6px;
      padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #0369a1; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .slider-row { width: 100%; margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
    input[type="range"] { flex: 1; }
    #telemetry { margin-top: 8px; font-size: 12px; color: #94a3b8; }

    #minimap-wrap {
      position: fixed; right: 14px; bottom: 14px; z-index: 10;
      width: 280px; height: 220px; border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      background: #1e293b;
    }
    #minimap { width: 100%; height: 100%; }
    #minimap-label {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      background: rgba(15, 23, 32, 0.78); color: #f8fafc;
      font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 5px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Bernina Switchbacks 3D</h1>
    <div id="status">Loading Mapterhorn elevation tiles...</div>
    <div class="controls">
      <button id="togglePauseBtn" class="secondary">Pause</button>
      <button id="reverseBtn" class="secondary">Reverse</button>
    </div>
    <div class="slider-row">
      <span>Speed</span>
      <input type="range" id="speedSlider" min="5" max="120" step="1" value="60" />
      <span id="speedValue">60 km/h</span>
    </div>
    <div id="telemetry">Progress: 0% · Elev: — m</div>
  </div>

  <div id="minimap-wrap">
    <div id="minimap-label">Route Position (Liberty)</div>
    <div id="minimap"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const GEOJSON_URL = 'https://mapsmania.github.io/mapchallenge/alpy.geojson';
    const BOUNDS = {
      south: 46.315,
      west: 10.010,
      north: 46.385,
      east: 10.080
    };
    const ORIGIN = {
      lat: 46.350,
      lon: 10.045
    };
    const ZOOM = 13;

    const statusEl = document.getElementById('status');
    const telemetryEl = document.getElementById('telemetry');

    // --- Three.js Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ec5e6);
    scene.fog = new THREE.FogExp2(0x9ec5e6, 0.00011);

    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 1, 25000);
    camera.position.set(0, 3200, 3500);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled = false;

    scene.add(new THREE.HemisphereLight(0xdbeafe, 0x3f4e3c, 1.1));
    const sun = new THREE.DirectionalLight(0xfffbeb, 1.8);
    sun.position.set(3000, 5000, 2000);
    scene.add(sun);

    // --- Coordinate Helpers ---
    const METERS_PER_DEG_LAT = 111132.92;
    const METERS_PER_DEG_LON = 111412.84 * Math.cos(THREE.MathUtils.degToRad(ORIGIN.lat));

    function lonLatToLocal(lon, lat) {
      return {
        x: (lon - ORIGIN.lon) * METERS_PER_DEG_LON,
        z: -(lat - ORIGIN.lat) * METERS_PER_DEG_LAT
      };
    }

    function localToLonLat(x, z) {
      return [
        ORIGIN.lon + x / METERS_PER_DEG_LON,
        ORIGIN.lat - z / METERS_PER_DEG_LAT
      ];
    }

    function lonToTileX(lon, z) {
      return Math.floor(((lon + 180) / 360) * Math.pow(2, z));
    }

    function latToTileY(lat, z) {
      const rad = THREE.MathUtils.degToRad(lat);
      return Math.floor(
        ((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2) * Math.pow(2, z)
      );
    }

    function tileXToLon(x, z) {
      return (x / Math.pow(2, z)) * 360 - 180;
    }

    function tileYToLat(y, z) {
      const n = Math.PI - (2 * Math.PI * y) / Math.pow(2, z);
      return THREE.MathUtils.radToDeg(Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))));
    }

    // --- MapLibre Inset Map (OpenFreeMap Liberty) ---
    const minimap = new maplibregl.Map({
      container: 'minimap',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [ORIGIN.lon, ORIGIN.lat],
      zoom: 12.2,
      pitch: 25,
      attributionControl: false,
      interactive: true
    });

    let minimapReady = false;
    let routeCoordsLonLat = [];
    let trainMarker = null;

    minimap.on('load', () => {
      minimapReady = true;

      minimap.addSource('full-route', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: [] }
        }
      });

      minimap.addLayer({
        id: 'full-route-line',
        type: 'line',
        source: 'full-route',
        paint: {
          'line-color': '#ef4444',
          'line-width': 3.5,
          'line-opacity': 0.85
        }
      });

      minimap.addSource('traveled-route', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: [] }
        }
      });

      minimap.addLayer({
        id: 'traveled-route-line',
        type: 'line',
        source: 'traveled-route',
        paint: {
          'line-color': '#38bdf8',
          'line-width': 4.5
        }
      });

      const markerEl = document.createElement('div');
      markerEl.style.width = '14px';
      markerEl.style.height = '14px';
      markerEl.style.borderRadius = '50%';
      markerEl.style.background = '#facc15';
      markerEl.style.border = '2.5px solid #0f172a';
      markerEl.style.boxShadow = '0 0 8px rgba(0,0,0,0.75)';

      trainMarker = new maplibregl.Marker({ element: markerEl })
        .setLngLat([ORIGIN.lon, ORIGIN.lat])
        .addTo(minimap);

      if (routeCoordsLonLat.length > 1) {
        syncMinimapRoute();
      }
    });

    function syncMinimapRoute() {
      if (!minimapReady || routeCoordsLonLat.length < 2) return;
      const fullSource = minimap.getSource('full-route');
      if (fullSource) {
        fullSource.setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: routeCoordsLonLat }
        });
      }
      const bounds = new maplibregl.LngLatBounds();
      for (const pt of routeCoordsLonLat) bounds.extend(pt);
      minimap.fitBounds(bounds, { padding: 24, duration: 400 });
    }

    function updateMinimapPosition(lon, lat, currentT) {
      if (!minimapReady || !trainMarker || routeCoordsLonLat.length < 2) return;
      trainMarker.setLngLat([lon, lat]);
      minimap.panTo([lon, lat], { duration: 60 });

      const traveledSource = minimap.getSource('traveled-route');
      if (traveledSource) {
        const endIdx = Math.max(1, Math.floor(currentT * (routeCoordsLonLat.length - 1)));
        const slice = routeCoordsLonLat.slice(0, endIdx + 1);
        slice.push([lon, lat]);
        traveledSource.setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: slice }
        });
      }
    }

    // --- Mapterhorn Elevation Grid ---
    let demCanvas, demCtx, demData, demWidth, demHeight;
    let demLonMin, demLonMax, demLatMin, demLatMax;

    async function loadMapterhornDEM() {
      const xMin = lonToTileX(BOUNDS.west, ZOOM);
      const xMax = lonToTileX(BOUNDS.east, ZOOM);
      const yMin = latToTileY(BOUNDS.north, ZOOM);
      const yMax = latToTileY(BOUNDS.south, ZOOM);

      const cols = xMax - xMin + 1;
      const rows = yMax - yMin + 1;

      const tilePromises = [];
      for (let ty = yMin; ty <= yMax; ty++) {
        for (let tx = xMin; tx <= xMax; tx++) {
          const url = `https://tiles.mapterhorn.com/${ZOOM}/${tx}/${ty}.webp`;
          tilePromises.push(
            new Promise((resolve, reject) => {
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.onload = () => resolve({ img, tx, ty });
              img.onerror = () => reject(new Error(`Failed to load tile ${ZOOM}/${tx}/${ty}`));
              img.src = url;
            })
          );
        }
      }

      const tiles = await Promise.all(tilePromises);
      const tileSize = tiles[0].img.width || 512;

      demWidth = cols * tileSize;
      demHeight = rows * tileSize;
      demCanvas = document.createElement('canvas');
      demCanvas.width = demWidth;
      demCanvas.height = demHeight;
      demCtx = demCanvas.getContext('2d', { willReadFrequently: true });

      for (const { img, tx, ty } of tiles) {
        demCtx.drawImage(img, (tx - xMin) * tileSize, (ty - yMin) * tileSize);
      }

      demData = demCtx.getImageData(0, 0, demWidth, demHeight).data;
      demLonMin = tileXToLon(xMin, ZOOM);
      demLonMax = tileXToLon(xMax + 1, ZOOM);
      demLatMax = tileYToLat(yMin, ZOOM);
      demLatMin = tileYToLat(yMax + 1, ZOOM);
    }

    function samplePixelElevation(px, py) {
      const cx = THREE.MathUtils.clamp(px, 0, demWidth - 1);
      const cy = THREE.MathUtils.clamp(py, 0, demHeight - 1);
      const idx = (cy * demWidth + cx) * 4;
      const r = demData[idx];
      const g = demData[idx + 1];
      const b = demData[idx + 2];
      return r * 256 + g + b / 256 - 32768;
    }

    function getElevationAtLonLat(lon, lat) {
      const u = ((lon - demLonMin) / (demLonMax - demLonMin)) * (demWidth - 1);
      const v = ((demLatMax - lat) / (demLatMax - demLatMin)) * (demHeight - 1);

      const x0 = Math.floor(u);
      const y0 = Math.floor(v);
      const x1 = x0 + 1;
      const y1 = y0 + 1;
      const fx = u - x0;
      const fy = v - y0;

      const h00 = samplePixelElevation(x0, y0);
      const h10 = samplePixelElevation(x1, y0);
      const h01 = samplePixelElevation(x0, y1);
      const h11 = samplePixelElevation(x1, y1);

      const h0 = h00 * (1 - fx) + h10 * fx;
      const h1 = h01 * (1 - fx) + h11 * fx;
      return h0 * (1 - fy) + h1 * fy;
    }

    // --- Build 3D Terrain Mesh (Higher density so tracks stay above ground) ---
    function buildTerrainMesh() {
      const segX = 520;
      const segZ = 640;
      const sw = lonLatToLocal(BOUNDS.west, BOUNDS.south);
      const ne = lonLatToLocal(BOUNDS.east, BOUNDS.north);

      const width = ne.x - sw.x;
      const depth = sw.z - ne.z;
      const centerX = (sw.x + ne.x) / 2;
      const centerZ = (sw.z + ne.z) / 2;

      const geo = new THREE.PlaneGeometry(width, depth, segX, segZ);
      geo.rotateX(-Math.PI / 2);

      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const color = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i) + centerX;
        const vz = pos.getZ(i) + centerZ;
        const [lon, lat] = localToLonLat(vx, vz);

        const elev = getElevationAtLonLat(lon, lat);
        pos.setXYZ(i, vx, elev, vz);

        if (elev < 1200) color.setHex(0x3a6b35);
        else if (elev < 1850) color.setHex(0x588157);
        else if (elev < 2450) color.setHex(0x8c8a82);
        else color.setHex(0xf1f5f9);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }

      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.92,
        metalness: 0.02
      });

      scene.add(new THREE.Mesh(geo, mat));
    }

    // --- Instanced Alpine Forest (Spruces & Golden Larches below treeline) ---
    const forestGroup = new THREE.Group();
    scene.add(forestGroup);

    function populateAlpineTrees(curve) {
      forestGroup.clear();
      if (!curve) return;

      const sw = lonLatToLocal(BOUNDS.west, BOUNDS.south);
      const ne = lonLatToLocal(BOUNDS.east, BOUNDS.north);

      // Build a fast 2D spatial hash of track points so trees keep clear of the rails
      const CELL_SIZE = 20;
      const CLEARANCE_SQ = 11.5 * 11.5; // 11.5 m minimum distance from track centreline
      const trackGrid = new Map();

      const routeSamples = Math.max(800, Math.ceil(curve.getLength() / 4));
      const sampledPts = curve.getSpacedPoints(routeSamples);

      for (const pt of sampledPts) {
        const gx = Math.floor(pt.x / CELL_SIZE);
        const gz = Math.floor(pt.z / CELL_SIZE);
        const key = `${gx},${gz}`;
        if (!trackGrid.has(key)) trackGrid.set(key, []);
        trackGrid.get(key).push(pt);
      }

      function isNearTrack(x, z) {
        const gx = Math.floor(x / CELL_SIZE);
        const gz = Math.floor(z / CELL_SIZE);
        for (let dx = -1; dx <= 1; dx++) {
          for (let dz = -1; dz <= 1; dz++) {
            const list = trackGrid.get(`${gx + dx},${gz + dz}`);
            if (!list) continue;
            for (const pt of list) {
              const d2 = (pt.x - x) ** 2 + (pt.z - z) ** 2;
              if (d2 < CLEARANCE_SQ) return true;
            }
          }
        }
        return false;
      }

      // Deterministic pseudo-random generator for reproducible forest layout
      let seed = 46350;
      function rand() {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      }

      const TARGET_TREES = 6500;
      const MAX_ATTEMPTS = 42000;
      const placements = [];

      for (let attempt = 0; attempt < MAX_ATTEMPTS && placements.length < TARGET_TREES; attempt++) {
        const x = sw.x + rand() * (ne.x - sw.x);
        const z = ne.z + rand() * (sw.z - ne.z);
        const [lon, lat] = localToLonLat(x, z);
        const elev = getElevationAtLonLat(lon, lat);

        // Alpine treeline around 2,050m; denser forest lower down in Val Poschiavo
        if (elev > 2050) continue;
        const densityProb = elev < 1650 ? 0.92 : Math.max(0.08, (2050 - elev) / 420);
        if (rand() > densityProb) continue;

        // Avoid steep cliff walls by checking local terrain slope
        const hRight = getElevationAtLonLat(lon + 0.00012, lat);
        const hUp = getElevationAtLonLat(lon, lat + 0.00009);
        const slope = Math.hypot((hRight - elev) / 9.2, (hUp - elev) / 10.0);
        if (slope > 0.72) continue;

        if (isNearTrack(x, z)) continue;

        // Stunted krummholz near treeline, taller spruces lower down
        const treelineFactor = THREE.MathUtils.clamp((2120 - elev) / 700, 0.45, 1.15);
        const scale = (0.7 + rand() * 0.75) * treelineFactor;
        const rotY = rand() * Math.PI * 2;
        const isLarch = elev > 1550 && rand() < 0.24; // Occasional golden Alpine larches higher up

        placements.push({ x, y: elev, z, scale, rotY, isLarch });
      }

      // Build a multi-tiered conifer crown geometry (3 stacked cones merged manually)
      function createConiferCrownGeometry() {
        const tiers = [
          { radius: 2.6, height: 5.2, yOffset: 3.6, radialSegs: 7 },
          { radius: 2.0, height: 4.6, yOffset: 6.2, radialSegs: 7 },
          { radius: 1.35, height: 4.0, yOffset: 8.6, radialSegs: 7 }
        ];

        const positions = [];
        const normals = [];
        const indices = [];
        let vertexOffset = 0;

        for (const t of tiers) {
          const cone = new THREE.ConeGeometry(t.radius, t.height, t.radialSegs, 1, false);
          cone.translate(0, t.yOffset, 0);
          const pos = cone.attributes.position;
          const norm = cone.attributes.normal;
          const idx = cone.index;

          for (let i = 0; i < pos.count; i++) {
            positions.push(pos.getX(i), pos.getY(i), pos.getZ(i));
            normals.push(norm.getX(i), norm.getY(i), norm.getZ(i));
          }
          for (let i = 0; i < idx.count; i++) {
            indices.push(idx.getX(i) + vertexOffset);
          }
          vertexOffset += pos.count;
          cone.dispose();
        }

        const merged = new THREE.BufferGeometry();
        merged.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        merged.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        merged.setIndex(indices);
        return merged;
      }

      const crownGeo = createConiferCrownGeometry();
      const crownMat = new THREE.MeshStandardMaterial({
        roughness: 0.9,
        metalness: 0.0,
        flatShading: true
      });

      const trunkGeo = new THREE.CylinderGeometry(0.22, 0.36, 2.2, 6);
      trunkGeo.translate(0, 1.0, 0);
      const trunkMat = new THREE.MeshStandardMaterial({
        color: 0x4a3525,
        roughness: 0.95
      });

      const crownMesh = new THREE.InstancedMesh(crownGeo, crownMat, placements.length);
      const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, placements.length);

      const dummy = new THREE.Object3D();
      const treeColor = new THREE.Color();
      const sprucePalette = [0x1f4529, 0x265331, 0x2d6038, 0x1b3b24];
      const larchPalette = [0xb47b2b, 0xc68b33, 0x9c6b25];

      for (let i = 0; i < placements.length; i++) {
        const p = placements[i];
        dummy.position.set(p.x, p.y - 0.15, p.z);
        dummy.rotation.set(0, p.rotY, 0);
        dummy.scale.set(p.scale, p.scale, p.scale);
        dummy.updateMatrix();

        crownMesh.setMatrixAt(i, dummy.matrix);
        trunkMesh.setMatrixAt(i, dummy.matrix);

        const palette = p.isLarch ? larchPalette : sprucePalette;
        treeColor.setHex(palette[i % palette.length]);
        crownMesh.setColorAt(i, treeColor);
      }

      crownMesh.instanceMatrix.needsUpdate = true;
      trunkMesh.instanceMatrix.needsUpdate = true;
      if (crownMesh.instanceColor) crownMesh.instanceColor.needsUpdate = true;

      forestGroup.add(trunkMesh);
      forestGroup.add(crownMesh);
    }

    // --- Stitch All GeoJSON Rail Segments into One Full Route ---
    let trainCurve = null;
    const trackGroup = new THREE.Group();
    scene.add(trackGroup);

    function distMeters(a, b) {
      const dx = (a[0] - b[0]) * METERS_PER_DEG_LON;
      const dy = (a[1] - b[1]) * METERS_PER_DEG_LAT;
      return Math.hypot(dx, dy);
    }

    function stitchLineStrings(features) {
      const remaining = [];
      for (const f of features) {
        if (!f.geometry) continue;
        if (f.geometry.type === 'LineString' && f.geometry.coordinates.length > 1) {
          remaining.push(f.geometry.coordinates.slice());
        } else if (f.geometry.type === 'MultiLineString') {
          for (const part of f.geometry.coordinates) {
            if (part.length > 1) remaining.push(part.slice());
          }
        }
      }

      if (!remaining.length) {
        return { coords: [], segmentCount: 0, joinedCount: 0, disconnectedCount: 0 };
      }

      const totalSegments = remaining.length;
      remaining.sort((a, b) => {
        const maxLatA = Math.max(a[0][1], a[a.length - 1][1]);
        const maxLatB = Math.max(b[0][1], b[b.length - 1][1]);
        return maxLatB - maxLatA;
      });

      let chain = remaining.shift();
      if (chain[0][1] < chain[chain.length - 1][1]) chain.reverse();

      const MAX_JOIN_GAP_METRES = 120;

      while (remaining.length) {
        let bestIdx = -1;
        let bestMode = null;
        let bestDist = Infinity;
        const head = chain[0];
        const tail = chain[chain.length - 1];

        for (let i = 0; i < remaining.length; i++) {
          const seg = remaining[i];
          const candidates = [
            { d: distMeters(tail, seg[0]), mode: 'append' },
            { d: distMeters(tail, seg[seg.length - 1]), mode: 'appendRev' },
            { d: distMeters(head, seg[seg.length - 1]), mode: 'prepend' },
            { d: distMeters(head, seg[0]), mode: 'prependRev' }
          ];

          for (const candidate of candidates) {
            if (candidate.d < bestDist) {
              bestDist = candidate.d;
              bestIdx = i;
              bestMode = candidate.mode;
            }
          }
        }

        if (bestIdx < 0 || bestDist > MAX_JOIN_GAP_METRES) break;

        const seg = remaining.splice(bestIdx, 1)[0];
        if (bestMode === 'append') chain = chain.concat(seg.slice(1));
        else if (bestMode === 'appendRev') chain = chain.concat(seg.reverse().slice(1));
        else if (bestMode === 'prepend') chain = seg.slice(0, -1).concat(chain);
        else if (bestMode === 'prependRev') chain = seg.reverse().slice(0, -1).concat(chain);
      }

      return {
        coords: chain,
        segmentCount: totalSegments,
        joinedCount: totalSegments - remaining.length,
        disconnectedCount: remaining.length
      };
    }

    function densifyTrackPoints(points, maxSpacing = 8) {
      const dense = [];
      for (let i = 0; i < points.length - 1; i++) {
        const a = points[i];
        const b = points[i + 1];
        const distance = a.distanceTo(b);
        const steps = Math.max(1, Math.ceil(distance / maxSpacing));

        for (let step = 0; step < steps; step++) {
          dense.push(a.clone().lerp(b, step / steps));
        }
      }
      dense.push(points[points.length - 1].clone());
      return dense;
    }

    function buildTrackFromGeoJSON(geojson) {
      trackGroup.clear();
      const features = geojson.type === 'FeatureCollection' ? geojson.features : [geojson];
      const { coords, segmentCount, joinedCount, disconnectedCount } = stitchLineStrings(features);

      if (coords.length < 4) {
        statusEl.textContent = 'Could not find enough connected railway track points.';
        return;
      }

      const rawPoints = coords.map(([lon, lat]) => {
        const { x, z } = lonLatToLocal(lon, lat);
        const y = getElevationAtLonLat(lon, lat);
        return new THREE.Vector3(x, y + 0.85, z);
      });

      const densePoints = densifyTrackPoints(rawPoints, 8);
      trainCurve = new THREE.CatmullRomCurve3(
        densePoints,
        false,
        'centripetal',
        0.5
      );

      const routeLengthMetres = trainCurve.getLength();
      const lengthKm = (routeLengthMetres / 1000).toFixed(1);
      const sampled = trainCurve.getSpacedPoints(600);
      routeCoordsLonLat = sampled.map((pt) => localToLonLat(pt.x, pt.z));
      syncMinimapRoute();

      const routeLength = trainCurve.getLength();
      const sampleSpacing = 1.5;
      const sampleCount = Math.max(100, Math.min(12000, Math.ceil(routeLength / sampleSpacing)));
      const sleeperSpacing = 0.65;
      const sleeperCount = Math.max(2, Math.floor(routeLength / sleeperSpacing));
      const railGauge = 1.435;
      const railOffset = railGauge / 2;

      const up = new THREE.Vector3(0, 1, 0);
      const basisMatrix = new THREE.Matrix4();
      const sleeperQuaternion = new THREE.Quaternion();
      const sleeperScale = new THREE.Vector3(1, 1, 1);
      const instanceMatrix = new THREE.Matrix4();

      const ballastGeometry = new THREE.BoxGeometry(3.0, 0.24, sampleSpacing + 0.12);
      const ballastMaterial = new THREE.MeshStandardMaterial({
        color: 0x77736b, roughness: 1.0, metalness: 0.0
      });
      const ballast = new THREE.InstancedMesh(ballastGeometry, ballastMaterial, sampleCount + 1);
      ballast.frustumCulled = false;

      const sleeperGeometry = new THREE.BoxGeometry(2.55, 0.16, 0.24);
      const sleeperMaterial = new THREE.MeshStandardMaterial({
        color: 0x514b43, roughness: 0.96, metalness: 0.02
      });
      const sleepers = new THREE.InstancedMesh(sleeperGeometry, sleeperMaterial, sleeperCount + 1);
      sleepers.frustumCulled = false;

      function routeFrame(t) {
        const point = trainCurve.getPointAt(THREE.MathUtils.clamp(t, 0, 1));
        const tangent = trainCurve.getTangentAt(THREE.MathUtils.clamp(t, 0, 1)).normalize();
        let lateral = new THREE.Vector3().crossVectors(up, tangent).normalize();
        if (lateral.lengthSq() < 0.0001) lateral.set(1, 0, 0);
        const vertical = new THREE.Vector3().crossVectors(tangent, lateral).normalize();
        return { point, tangent, lateral, vertical };
      }

      for (let i = 0; i <= sampleCount; i++) {
        const t = i / sampleCount;
        const { point, tangent, lateral, vertical } = routeFrame(t);
        basisMatrix.makeBasis(lateral, vertical, tangent);
        sleeperQuaternion.setFromRotationMatrix(basisMatrix);

        const ballastPosition = point.clone().addScaledVector(vertical, -0.22);
        instanceMatrix.compose(ballastPosition, sleeperQuaternion, sleeperScale);
        ballast.setMatrixAt(i, instanceMatrix);
      }
      ballast.instanceMatrix.needsUpdate = true;
      trackGroup.add(ballast);

      for (let i = 0; i <= sleeperCount; i++) {
        const t = i / sleeperCount;
        const { point, tangent, lateral, vertical } = routeFrame(t);
        basisMatrix.makeBasis(lateral, vertical, tangent);
        sleeperQuaternion.setFromRotationMatrix(basisMatrix);
        const sleeperPosition = point.clone().addScaledVector(vertical, -0.10);
        instanceMatrix.compose(sleeperPosition, sleeperQuaternion, sleeperScale);
        sleepers.setMatrixAt(i, instanceMatrix);
      }
      sleepers.instanceMatrix.needsUpdate = true;
      trackGroup.add(sleepers);

      function makeRailCurve(side) {
        const railPoints = [];
        const railSamples = Math.max(200, Math.min(12000, Math.ceil(routeLength / 1.0)));
        for (let i = 0; i <= railSamples; i++) {
          const { point, lateral, vertical } = routeFrame(i / railSamples);
          point.addScaledVector(lateral, side * railOffset);
          point.addScaledVector(vertical, 0.055);
          railPoints.push(point);
        }
        return new THREE.CatmullRomCurve3(railPoints, false, 'centripetal', 0.5);
      }

      const railMaterial = new THREE.MeshStandardMaterial({
        color: 0x9da6ad, roughness: 0.32, metalness: 0.82
      });
      for (const side of [-1, 1]) {
        const railCurve = makeRailCurve(side);
        const railGeometry = new THREE.TubeGeometry(
          railCurve,
          Math.max(200, Math.min(16000, Math.ceil(routeLength * 2))),
          0.055,
          8,
          false
        );
        trackGroup.add(new THREE.Mesh(railGeometry, railMaterial));
      }

      populateAlpineTrees(trainCurve);

      progress = 0;
      suspensionDistance = 0;
      cameraBank = 0;

      let message = `Connected ${joinedCount}/${segmentCount} track sections · ${lengthKm} km`;
      if (disconnectedCount > 0) {
        message += ` · ignored ${disconnectedCount} disconnected sections`;
      }
      statusEl.textContent = message;
    }

    async function loadGeoJSONFromUrl() {
      statusEl.textContent = 'Fetching Bernina railway data...';
      const res = await fetch(GEOJSON_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${GEOJSON_URL}`);
      const data = await res.json();
      buildTrackFromGeoJSON(data);
    }

    // --- UI Events ---
    let paused = false;
    let direction = 1;
    let progress = 0;
    let currentSpeedKmh = 30;
    let cameraBank = 0;
    let suspensionDistance = 0;
    const speedSlider = document.getElementById('speedSlider');
    const speedValueEl = document.getElementById('speedValue');

    function updateSpeedLabel() {
      speedValueEl.textContent = `${speedSlider.value} km/h`;
    }
    speedSlider.addEventListener('input', updateSpeedLabel);
    updateSpeedLabel();

    document.getElementById('togglePauseBtn').addEventListener('click', (e) => {
      paused = !paused;
      controls.enabled = paused;
      if (paused && trainCurve) {
        const ahead = trainCurve.getPointAt(
          THREE.MathUtils.clamp(progress + 0.01 * direction, 0, 1)
        );
        controls.target.copy(ahead);
      }
      e.target.textContent = paused ? 'Resume Ride' : 'Pause';
    });

    document.getElementById('reverseBtn').addEventListener('click', () => {
      direction *= -1;
    });

    // --- Animation Loop ---
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 2.6;
    const lastLookAhead = 0.006;
    let lastMinimapUpdate = 0;

    function wrapProgress(value) {
      return ((value % 1) + 1) % 1;
    }

    function animate(now = 0) {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (trainCurve && !paused) {
        const targetSpeedKmh = parseFloat(speedSlider.value);
        currentSpeedKmh = THREE.MathUtils.damp(
          currentSpeedKmh,
          targetSpeedKmh,
          1.8,
          dt
        );

        const speedMetresPerSecond = currentSpeedKmh / 3.6;
        const routeLength = trainCurve.getLength();

        if (routeLength > 0) {
          progress = wrapProgress(
            progress + (speedMetresPerSecond * dt / routeLength) * direction
          );
          suspensionDistance += speedMetresPerSecond * dt;
        }

        const pos = trainCurve.getPointAt(progress);
        const lookT = wrapProgress(progress + lastLookAhead * direction);
        const lookPt = trainCurve.getPointAt(lookT);

        const tangentBefore = trainCurve
          .getTangentAt(wrapProgress(progress - 0.004 * direction))
          .multiplyScalar(direction)
          .normalize();
        const tangentAfter = trainCurve
          .getTangentAt(wrapProgress(progress + 0.004 * direction))
          .multiplyScalar(direction)
          .normalize();

        const crossY =
          tangentBefore.z * tangentAfter.x -
          tangentBefore.x * tangentAfter.z;
        const dot = THREE.MathUtils.clamp(tangentBefore.dot(tangentAfter), -1, 1);
        const headingChange = Math.atan2(crossY, dot);
        const targetBank = THREE.MathUtils.clamp(
          -headingChange * 5.5,
          -0.14,
          0.14
        );
        cameraBank = THREE.MathUtils.damp(cameraBank, targetBank, 3.0, dt);

        const suspension =
          Math.sin(suspensionDistance * 0.75) * 0.035 +
          Math.sin(suspensionDistance * 1.9) * 0.012;

        camera.position.set(
          pos.x,
          pos.y + EYE_HEIGHT + suspension,
          pos.z
        );
        camera.lookAt(
          lookPt.x,
          lookPt.y + EYE_HEIGHT * 0.9,
          lookPt.z
        );
        camera.rotateZ(cameraBank);

        telemetryEl.textContent =
          `Progress: ${(progress * 100).toFixed(1)}% · ` +
          `Elev: ${Math.round(pos.y)} m · ` +
          `Speed: ${currentSpeedKmh.toFixed(0)} km/h`;

        if (now - lastMinimapUpdate > 80) {
          lastMinimapUpdate = now;
          const [lon, lat] = localToLonLat(pos.x, pos.z);
          updateMinimapPosition(lon, lat, progress);
        }
      } else if (paused) {
        controls.update();
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Boot ---
    try {
      await loadMapterhornDEM();
      buildTerrainMesh();
      await loadGeoJSONFromUrl();
    } catch (err) {
      statusEl.textContent = 'Startup error: ' + err.message;
      console.error(err);
    }
    animate();
  </script>
</body>
</html>
