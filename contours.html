// Phase 1: Algorithmic Contour Scale Chime


function playContourNote(normalizedElevation, index) {

    if (
        !soundEnabled ||
        !audioCtx ||
        !vibesReady ||
        !soundfontInstruments.vibes
    ) return;

    const norm = Number.isFinite(normalizedElevation)
        ? THREE.MathUtils.clamp(normalizedElevation, 0, 1)
        : 0;

    const safeIndex = Number.isInteger(index) ? index : 0;

    const piMod = piDigits[safeIndex % piDigits.length];

    const motifIndex = Math.floor(
        (norm * 8 + piMod) % ambientMotif.length
    );

    const freq = ambientMotif[motifIndex];

    if (!Number.isFinite(freq) || freq <= 0) return;

    const midiNote = Math.round(
        69 + 12 * Math.log2(freq / 440)
    );

    const velocity = 45 + norm * 25;
    const duration = 0.45 + norm * 0.25;

    try {
        soundfontInstruments.vibes.start({
            note: midiNote,
            velocity,
            time: audioCtx.currentTime,
            duration
        });
    } catch (error) {
        console.warn("Phase 1 vibraphone note failed:", error);
    }
}

// Phase 2: Cinematic Camera Tilt Swoosh
function playTiltSwoosh() {
    if (!soundEnabled || !audioCtx) return;

    const now = audioCtx.currentTime;

    const bass = audioCtx.createOscillator();
    const bassGain = audioCtx.createGain();

    bass.type = 'sine';
    bass.frequency.setValueAtTime(110, now);
    bass.frequency.exponentialRampToValueAtTime(45, now + TILT_DURATION);

    bassGain.gain.setValueAtTime(0.0001, now);
    bassGain.gain.linearRampToValueAtTime(0.035, now + 1.2);
    bassGain.gain.linearRampToValueAtTime(0.0001, now + TILT_DURATION);

    bass.connect(bassGain);
    bassGain.connect(audioCtx.destination);

    bass.start(now);
    bass.stop(now + TILT_DURATION);

    const bufferSize = Math.floor(audioCtx.sampleRate * TILT_DURATION);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const channel = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
        channel[i] = Math.random() * 2 - 1;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(400, now);
    filter.frequency.exponentialRampToValueAtTime(1600, now + TILT_DURATION);
    filter.Q.value = 0.7;

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, now);
    noiseGain.gain.linearRampToValueAtTime(0.018, now + 1.5);
    noiseGain.gain.linearRampToValueAtTime(0.0001, now + TILT_DURATION);

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + TILT_DURATION);
}

// Phase 3: Unexaggerate Upward Sweep (Reverse Phase 2)
function playFlattenTick() {
    if (!soundEnabled || !audioCtx) return;

    const now = audioCtx.currentTime;
    const duration = UNEXAGGERATE_DURATION;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(55, now);
    osc.frequency.exponentialRampToValueAtTime(330, now + duration);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.03, now + duration * 0.8);
    gain.gain.linearRampToValueAtTime(0.0001, now + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + duration);

    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const channel = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
        channel[i] = Math.random() * 2 - 1;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(200, now);
    filter.frequency.exponentialRampToValueAtTime(1200, now + duration);
    filter.Q.value = 1.0;

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, now);
    noiseGain.gain.linearRampToValueAtTime(0.015, now + duration * 0.7);

    filter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + duration);
}

// ================================================
// GENERATE A LANDSCAPE-SPECIFIC COMPOSITION

function createContourTune() {

    musicEvents = [];
    musicLoopDuration = 0;
    nextMusicEvent = 0;
    lastMusicCycle = -1;

    if (!contourObjects.length) return;

    const sortedContours = [...contourObjects].sort(
        (a, b) => a.elevation - b.elevation
    );

    // --------------------------------
    // MEASURE CONTOUR GEOMETRY
    // --------------------------------

    const measurements = sortedContours.map(item => {

        const positions = item.strokes[0].basePositions;

        let totalLength = 0;
        let weightedX = 0;

        for (let i = 0; i < positions.length - 5; i += 6) {

            const x1 = positions[i];
            const z1 = positions[i + 2];
            const x2 = positions[i + 3];
            const z2 = positions[i + 5];

            const dx = x2 - x1;
            const dz = z2 - z1;
            const length = Math.sqrt(dx * dx + dz * dz);

            totalLength += length;
            weightedX += ((x1 + x2) / 2) * length;
        }

        return {
            elevation: item.elevation,
            length: totalLength,
            centreX: totalLength > 0 ? weightedX / totalLength : 0,
            complexity: item.vertexCount / 2
        };
    });

    const maxLength = Math.max(
        ...measurements.map(m => m.length),
        1
    );

    const maxComplexity = Math.max(
        ...measurements.map(m => m.complexity),
        1
    );

    // --------------------------------
    // CREATE A MUSICAL FINGERPRINT
    // --------------------------------

    // The fingerprint is derived from the actual landscape.
    // The same terrain will always generate the same music.

    let fingerprint = 2166136261;

    measurements.forEach(item => {

        const values = [
            Math.round(item.elevation * 10),
            Math.round(item.length * 100),
            Math.round(item.centreX * 100),
            Math.round(item.complexity * 10)
        ];

        values.forEach(value => {

            fingerprint ^= value;
            fingerprint = Math.imul(fingerprint, 16777619);

        });
    });

    fingerprint >>>= 0;

    // --------------------------------
    // MUSICAL PERSONALITIES
    // --------------------------------

    // Each landscape selects one of four musical characters.
    // All remain compatible with the existing instruments.

    const musicalStyles = [

        {
            name: "Dreamy Major",
            scale: [60, 62, 64, 67, 69, 72, 74, 76, 79, 81, 84],

            chords: [
                { root: 48, notes: [60, 64, 67, 71] },
                { root: 45, notes: [57, 60, 64, 67] },
                { root: 41, notes: [53, 57, 60, 64] },
                { root: 43, notes: [55, 59, 62, 64] }
            ],

            tempo: 1.00
        },

        {
            name: "Gentle Minor",
            scale: [57, 60, 62, 64, 67, 69, 72, 74, 76, 79, 81],

            chords: [
                { root: 45, notes: [57, 60, 64, 67] },
                { root: 41, notes: [53, 57, 60, 64] },
                { root: 48, notes: [55, 60, 64, 69] },
                { root: 43, notes: [55, 59, 62, 67] }
            ],

            tempo: 0.92
        },

        {
            name: "Mountain Dorian",
            scale: [62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 81],

            chords: [
                { root: 50, notes: [62, 65, 69, 72] },
                { root: 55, notes: [59, 62, 65, 69] },
                { root: 48, notes: [60, 64, 67, 71] },
                { root: 50, notes: [62, 65, 69, 72] }
            ],

            tempo: 1.08
        },

        {
            name: "Open Skies",
            scale: [55, 57, 59, 62, 64, 67, 69, 71, 74, 76, 79],

            chords: [
                { root: 43, notes: [55, 59, 62, 66] },
                { root: 50, notes: [57, 62, 66, 69] },
                { root: 48, notes: [55, 60, 64, 69] },
                { root: 45, notes: [57, 62, 64, 69] }
            ],

            tempo: 1.05
        }

    ];

    const style = musicalStyles[
        fingerprint % musicalStyles.length
    ];

    const MELODY_SCALE = style.scale;
    const CHORD_PROGRESSION = style.chords;

    // Slightly vary tempo according to the landscape.
    const tempoVariation =
        ((fingerprint >>> 8) % 9 - 4) * 0.015;

    const beatDuration =
        BEAT_DURATION * style.tempo * (1 + tempoVariation);

    const eighthDuration = beatDuration / 2;

    // --------------------------------
    // DETERMINE COMPOSITION LENGTH
    // --------------------------------

    const bars = Math.max(
        4,
        Math.ceil(measurements.length / 32) * 4
    );

    const beatsPerBar = 4;

    musicLoopDuration = bars * beatsPerBar * beatDuration;

    // --------------------------------
    // CHORDS AND BASS
    // --------------------------------

    for (let bar = 0; bar < bars; bar++) {

        const chord = CHORD_PROGRESSION[bar % 4];
        const barTime = bar * beatsPerBar * beatDuration;

        musicEvents.push({
            time: barTime,
            type: 'chord',
            notes: chord.notes
        });

        for (let beat = 0; beat < beatsPerBar; beat++) {

            musicEvents.push({
                time: barTime + beat * beatDuration,
                type: 'bass',
                pitch: chord.root - 12
            });
        }
    }

    // --------------------------------
    // CONTOUR MELODY
    // --------------------------------

    measurements.forEach((item, index) => {

        const elevation = THREE.MathUtils.clamp(
            (item.elevation - minElevVal) /
            (maxElevVal - minElevVal || 1),
            0,
            1
        );

        const size = Math.sqrt(item.length / maxLength);

        const complexity =
            Math.log1p(item.complexity) /
            Math.log1p(maxComplexity);

        // Elevation determines the basic note.
        let scaleIndex = Math.round(
            elevation * (MELODY_SCALE.length - 1)
        );

        // Contour size adds a little melodic variation.
        if (size > 0.65 && index % 3 === 0) {
            scaleIndex += 1;
        }

        if (complexity > 0.75 && index % 4 === 0) {
            scaleIndex -= 1;
        }

        scaleIndex = THREE.MathUtils.clamp(
            scaleIndex,
            0,
            MELODY_SCALE.length - 1
        );

        const pitch = MELODY_SCALE[scaleIndex];

        const piModifier = piDigits[index % piDigits.length];

        const duration = 0.24 + size * 0.35;

        const volume = 0.018 + complexity * 0.012;

        const pan = THREE.MathUtils.clamp(
            item.centreX / ((sceneBoundingSize || 1) / 2),
            -0.85,
            0.85
        );

        const time = index * eighthDuration;

        if (time >= musicLoopDuration) return;

        const isRest =
            piModifier === 9 && index % 3 === 0;

        if (!isRest) {

            musicEvents.push({
                time,
                type: 'melody',
                pitch,
                duration,
                volume,
                pan,
                complexity,
                index
            });
        }

        // Occasional echo notes.
        if (complexity > 0.85 && index % 5 === 0) {

            musicEvents.push({
                time: time + eighthDuration * 0.5,
                type: 'melody',
                pitch: Math.min(pitch + 7, 84),
                duration: 0.2,
                volume: volume * 0.45,
                pan: -pan,
                complexity: 0.2,
                index
            });
        }
    });

    // --------------------------------
    // SORT MUSICAL EVENTS
    // --------------------------------

    const priority = {
        chord: 0,
        bass: 1,
        melody: 2
    };

    musicEvents.sort((a, b) =>
        a.time - b.time ||
        priority[a.type] - priority[b.type]
    );

    console.log(
        'Generated mountain composition:',
        style.name,
        '| Tempo factor:',
        (style.tempo * (1 + tempoVariation)).toFixed(2),
        '|',
        musicEvents.length,
        'events;',
        bars,
        'bars;',
        musicLoopDuration.toFixed(1),
        'seconds'
    );
}



// ================================================
// SCHEDULE MUSIC AGAINST THE AUDIO CLOCK
// ================================================

function scheduleMusicEvent(event, startAt) {
    if (event.type === 'chord') {
        playMusicChord(event.notes, startAt);
    } else if (event.type === 'bass') {
        playMusicBass(event.pitch, startAt);
    } else if (event.type === 'melody') {
        playMelodyNote(event, startAt);
    }
}


function updateContourMusic(rotationTime) {
    if (
        !soundEnabled ||
        !audioCtx ||
        !musicEvents.length ||
        !musicLoopDuration
    ) {
        return;
    }

    const cycle = Math.floor(rotationTime / musicLoopDuration);
    const position = rotationTime % musicLoopDuration;

    // Start at the correct place when a new musical cycle begins.
    // This also handles enabling sound part-way through the animation.
    if (cycle !== lastMusicCycle) {
        nextMusicEvent = 0;
        lastMusicCycle = cycle;

        while (
            nextMusicEvent < musicEvents.length &&
            musicEvents[nextMusicEvent].time < position - 0.03
        ) {
            nextMusicEvent++;
        }
    }

    // Schedule a short distance into the future.
    // Web Audio handles the actual timing accurately.
    while (nextMusicEvent < musicEvents.length) {
        const event = musicEvents[nextMusicEvent];

        if (event.time > position + MUSIC_LOOKAHEAD) {
            break;
        }

        const delay = Math.max(0, event.time - position);
        const startAt = audioCtx.currentTime + delay;

        scheduleMusicEvent(event, startAt);

        nextMusicEvent++;
    }
}

// ================================================
// GLOBAL VARIABLES
// ================================================

const container = document.getElementById('scene');
const status = document.getElementById('status');
const locationSelect = document.getElementById('locationSelect');
const soundToggle = document.getElementById('soundToggle');

let contourObjects = [];
let startTime = null;
let animationFinished = false;

let baseViewSize = 20000;
let sceneBoundingSize = 20000;
let mountainCentreHeight = 0;

let minElevVal = 0;
let maxElevVal = 0;
let buildVersion = 0;

let tiltSoundTriggered = false;
let flattenSoundTriggered = false;
let zoomSoundTriggered = false;

// ================================================
// THREE.JS SCENE
// ================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.OrthographicCamera(
    -10, 10, 10, -10, 0.1, 500000
);

camera.position.set(0, 50000, 0);
camera.up.set(0, 0, -1);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NoToneMapping;

container.appendChild(renderer.domElement);

const mountain = new THREE.Group();
scene.add(mountain);

// ================================================
// COLOUR MAP
// ================================================

const colourStops = [
    { t: 0.00, c: '#482080' },
    { t: 0.20, c: '#68419b' },
    { t: 0.40, c: '#9275b5' },
    { t: 0.58, c: '#b9a5c7' },
    { t: 0.72, c: '#d5c18e' },
    { t: 0.86, c: '#c7a34e' },
    { t: 1.00, c: '#a77d35' }
];

function getColour(t) {
    t = THREE.MathUtils.clamp(t, 0, 1);
    for (let i = 0; i < colourStops.length - 1; i++) {
        const a = colourStops[i];
        const b = colourStops[i + 1];
        if (t >= a.t && t <= b.t) {
            const p = (t - a.t) / (b.t - a.t);
            return new THREE.Color(a.c).lerp(new THREE.Color(b.c), p);
        }
    }
    return new THREE.Color('#a77d35');
}

// ================================================
// HASH URL HANDLING
// ================================================

function readHash() {
    const hash = location.hash.substring(1);
    if (!hash) return null;
    const [lat, lng] = hash.split(',').map(Number);
    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng) ||
        lat < -85 || lat > 85 ||
        lng < -180 || lng > 180
    ) {
        return null;
    }
    return { lat, lng };
}

function updateDropdownSelection() {
    for (let option of locationSelect.options) {
        const [optLat, optLon] = option.value.split(',').map(Number);
        if (Math.abs(optLat - CENTER.lat) < 0.01 && Math.abs(optLon - CENTER.lon) < 0.01) {
            locationSelect.value = option.value;
            updateHudTitles(option);
            return;
        }
    }
    document.getElementById('mountainTitle').textContent = 'CUSTOM PEAK';
    document.getElementById('mountainSubtitle').textContent = `${CENTER.lat.toFixed(3)}, ${CENTER.lon.toFixed(3)}`;
}

function updateHudTitles(option) {
    document.getElementById('mountainTitle').textContent = option.getAttribute('data-name');
    document.getElementById('mountainSubtitle').textContent = option.getAttribute('data-sub');
}

// ================================================
// MAPTERHORN TILE FUNCTIONS
// ================================================

function lonLatToTile(lon, lat, z) {
    const n = 2 ** z;
    const latRad = lat * Math.PI / 180;
    const x = (lon + 180) / 360 * n;
    const y = (1 - Math.asinh(Math.tan(latRad)) / Math.PI) / 2 * n;
    return { x, y };
}

function tileUrl(z, x, y) {
    return `https://tiles.mapterhorn.com/${z}/${x}/${y}.webp`;
}

function decodeTerrarium(r, g, b) {
    return (r * 256 + g + b / 256) - 32768;
}

async function loadTile(z, x, y) {
    const n = 2 ** z;
    x = ((x % n) + n) % n;
    y = THREE.MathUtils.clamp(y, 0, n - 1);

    const response = await fetch(tileUrl(z, x, y));
    if (!response.ok) {
        throw new Error(`Tile request failed: ${z}/${x}/${y}`);
    }

    const blob = await response.blob();
    const bitmap = await createImageBitmap(blob);
    const canvas = document.createElement('canvas');
    canvas.width = TILE_SIZE;
    canvas.height = TILE_SIZE;

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bitmap, 0, 0, TILE_SIZE, TILE_SIZE);
    bitmap.close();

    return ctx.getImageData(0, 0, TILE_SIZE, TILE_SIZE).data;
}

// ================================================
// ELEVATION SAMPLING & CONTOURS
// ================================================

function sampleBilinear(data, width, height, x, y) {
    x = THREE.MathUtils.clamp(x, 0, width - 1.001);
    y = THREE.MathUtils.clamp(y, 0, height - 1.001);

    const x0 = Math.floor(x);
    const y0 = Math.floor(y);
    const x1 = x0 + 1;
    const y1 = y0 + 1;
    const tx = x - x0;
    const ty = y - y0;

    const at = (xx, yy) => data[yy * width + xx];

    return (
        at(x0, y0) * (1 - tx) * (1 - ty) +
        at(x1, y0) * tx * (1 - ty) +
        at(x0, y1) * (1 - tx) * ty +
        at(x1, y1) * tx * ty
    );
}

function makeContours(heights, size, worldWidth, worldDepth, minH, maxH) {
    const results = [];
    const stepX = worldWidth / (size - 1);
    const stepZ = worldDepth / (size - 1);
    const firstLevel = Math.ceil(minH / CONTOUR_INTERVAL) * CONTOUR_INTERVAL;

    for (let level = firstLevel; level <= maxH; level += CONTOUR_INTERVAL) {
        const positions = [];
        for (let j = 0; j < size - 1; j++) {
            for (let i = 0; i < size - 1; i++) {
                const h00 = heights[j * size + i];
                const h10 = heights[j * size + i + 1];
                const h01 = heights[(j + 1) * size + i];
                const h11 = heights[(j + 1) * size + i + 1];

                const x = -worldWidth / 2 + i * stepX;
                const z = -worldDepth / 2 + j * stepZ;

                const p = [
                    { x, y: h00, z, h: h00 },
                    { x: x + stepX, y: h10, z, h: h10 },
                    { x: x + stepX, y: h11, z: z + stepZ, h: h11 },
                    { x, y: h01, z: z + stepZ, h: h01 }
                ];

                const hits = [];
                for (let e = 0; e < 4; e++) {
                    const a = p[e];
                    const b = p[(e + 1) % 4];
                    if ((a.h < level && b.h >= level) || (b.h < level && a.h >= level)) {
                        const t = (level - a.h) / (b.h - a.h);
                        hits.push({
                            x: a.x + (b.x - a.x) * t,
                            z: a.z + (b.z - a.z) * t
                        });
                    }
                }

                function addPair(a, b) {
                    positions.push(a.x, level - minH, a.z, b.x, level - minH, b.z);
                }

                if (hits.length === 2) {
                    addPair(hits[0], hits[1]);
                } else if (hits.length === 4) {
                    const centre = (h00 + h10 + h01 + h11) / 4;
                    const pairs = centre >= level ? [[0, 1], [2, 3]] : [[0, 3], [1, 2]];
                    for (const [a, b] of pairs) {
                        addPair(hits[a], hits[b]);
                    }
                }
            }
        }

        if (positions.length) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setDrawRange(0, 0);
            results.push({ geometry, vertexCount: positions.length / 3, elevation: level });
        }
    }
    return results;
}

function addContour(item, colour) {
    const strokes = [];
    const original = item.geometry.attributes.position;
    const vertexCount = original.count;
    const jitter = sceneBoundingSize * 0.00035;

    for (let pass = 0; pass < 3; pass++) {
        const basePositions = new Float32Array(vertexCount * 3);
        const currentPositions = new Float32Array(vertexCount * 3);

        for (let i = 0; i < vertexCount; i++) {
            const x = original.getX(i);
            const y = original.getY(i);
            const z = original.getZ(i);

            const wave = Math.sin(i * 1.7 + pass * 2.1);
            const wave2 = Math.cos(i * 1.3 + pass * 1.8);
            const displacement = jitter * (pass + 1) * 0.4;

            const px = x + wave * displacement;
            const pz = z + wave2 * displacement;

            basePositions[i * 3] = px;
            basePositions[i * 3 + 1] = y;
            basePositions[i * 3 + 2] = pz;

            currentPositions[i * 3] = px;
            currentPositions[i * 3 + 1] = y * INITIAL_VERTICAL_EXAGGERATION;
            currentPositions[i * 3 + 2] = pz;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
        geometry.setDrawRange(0, 0);

        const material = new THREE.LineBasicMaterial({
            color: colour,
            transparent: true,
            opacity: LINE_OPACITY / (pass + 1),
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            toneMapped: false
        });

        const line = new THREE.LineSegments(geometry, material);
        line.frustumCulled = false;
        mountain.add(line);
        strokes.push({ line, geometry, basePositions });
    }

    return { strokes, vertexCount, elevation: item.elevation, soundPlayed: false };
}

function clearMountain() {
    contourObjects.forEach(item => {
        item.strokes.forEach(stroke => {
            mountain.remove(stroke.line);
            stroke.geometry.dispose();
            stroke.line.material.dispose();
        });
    });
    contourObjects = [];
}

// ================================================
// BUILD SCENE
// ================================================

async function build() {
    const version = ++buildVersion;
    clearMountain();
    mountain.rotation.set(0, 0, 0);

    startTime = null;
    animationFinished = false;

    status.textContent = 'FETCHING MAPTERHORN ELEVATION TILES...';

    const centerTile = lonLatToTile(CENTER.lon, CENTER.lat, ZOOM);
    const cx = Math.floor(centerTile.x);
    const cy = Math.floor(centerTile.y);
    const firstX = cx - TILE_RADIUS;
    const firstY = cy - TILE_RADIUS;
    const count = TILE_RADIUS * 2;
    const fullSize = count * TILE_SIZE;

    const mosaic = new Float32Array(fullSize * fullSize);
    const tasks = [];

    for (let ty = 0; ty < count; ty++) {
        for (let tx = 0; tx < count; tx++) {
            tasks.push((async () => {
                const data = await loadTile(ZOOM, firstX + tx, firstY + ty);
                for (let row = 0; row < TILE_SIZE; row++) {
                    const dest = (ty * TILE_SIZE + row) * fullSize + tx * TILE_SIZE;
                    for (let col = 0; col < TILE_SIZE; col++) {
                        const k = (row * TILE_SIZE + col) * 4;
                        mosaic[dest + col] = decodeTerrarium(data[k], data[k + 1], data[k + 2]);
                    }
                }
            })());
        }
    }

    let done = 0;
    await Promise.all(tasks.map(p => p.then(() => {
        done++;
        if (version === buildVersion) {
            status.textContent = `LOADING ELEVATION TILES... ${done}/${tasks.length}`;
        }
    })));

    if (version !== buildVersion) return;

    const cosLat = Math.cos(CENTER.lat * Math.PI / 180);
    const metresPerPixel = 40075016.685 / (2 ** ZOOM * TILE_SIZE) * cosLat;
    const worldWidth = fullSize * metresPerPixel;
    const worldDepth = worldWidth;

    sceneBoundingSize = Math.max(worldWidth, worldDepth);

    const heights = new Float32Array(GRID_SIZE * GRID_SIZE);
    let minH = Infinity;
    let maxH = -Infinity;

    for (let j = 0; j < GRID_SIZE; j++) {
        for (let i = 0; i < GRID_SIZE; i++) {
            const sx = i / (GRID_SIZE - 1) * (fullSize - 1);
            const sy = j / (GRID_SIZE - 1) * (fullSize - 1);
            const h = sampleBilinear(mosaic, fullSize, fullSize, sx, sy);
            heights[j * GRID_SIZE + i] = h;
            minH = Math.min(minH, h);
            maxH = Math.max(maxH, h);
        }
    }

    if (version !== buildVersion) return;

    minElevVal = minH;
    maxElevVal = maxH;
    mountainCentreHeight = (maxH - minH) * INITIAL_VERTICAL_EXAGGERATION * 0.5;

    status.textContent = 'GENERATING CONTOUR LINES...';

    const generated = makeContours(heights, GRID_SIZE, worldWidth, worldDepth, minH, maxH);
    if (version !== buildVersion) return;

    generated.sort((a, b) => a.vertexCount - b.vertexCount);
    generated.forEach(item => {
        const t = (item.elevation - minH) / (maxH - minH || 1);
        const colour = getColour(t);
        contourObjects.push(addContour(item, colour));
        item.geometry.dispose();
    });

    createContourTune();

    const aspect = window.innerWidth / window.innerHeight;
    baseViewSize = sceneBoundingSize * 1.05;

    camera.left = -baseViewSize * aspect / 2;
    camera.right = baseViewSize * aspect / 2;
    camera.top = baseViewSize / 2;
    camera.bottom = -baseViewSize / 2;
    camera.zoom = 0.38;
    camera.updateProjectionMatrix();

    document.getElementById('highLabel').textContent = maxH.toLocaleString(undefined, {maximumFractionDigits: 0}) + ' m';
    document.getElementById('lowLabel').textContent = minH.toLocaleString(undefined, {maximumFractionDigits: 0}) + ' m';

    status.textContent = `${contourObjects.length} CONTOUR LEVELS // READY TO ANIMATE`;

    replayAnimation();
}

// ================================================
// REPLAY ANIMATION
// ================================================

function replayAnimation() {
    startTime = performance.now();
    animationFinished = false;
    mountain.rotation.set(0, 0, 0);

    tiltSoundTriggered = false;
    flattenSoundTriggered = false;
    zoomSoundTriggered = false;
    nextMusicEvent = 0;
    lastMusicCycle = -1;

    contourObjects.forEach(item => {
        item.soundPlayed = false;
        item.strokes.forEach(strokeData => {
            strokeData.geometry.setDrawRange(0, 0);
            const posAttr = strokeData.geometry.attributes.position;
            const posArray = posAttr.array;
            const baseArray = strokeData.basePositions;

            for (let i = 0; i < posAttr.count; i++) {
                posArray[i * 3 + 1] = baseArray[i * 3 + 1] * INITIAL_VERTICAL_EXAGGERATION;
            }
            posAttr.needsUpdate = true;
        });
    });

    const aspect = window.innerWidth / window.innerHeight;
    camera.left = -baseViewSize * aspect / 2;
    camera.right = baseViewSize * aspect / 2;
    camera.top = baseViewSize / 2;
    camera.bottom = -baseViewSize / 2;
    camera.zoom = 0.38;
    camera.position.set(0, sceneBoundingSize * 2, 0);
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    status.textContent = 'DRAWING CONTOURS...';
}

// ================================================
// ANIMATION LOOP
// ================================================

function animate(now) {
    requestAnimationFrame(animate);

    if (startTime !== null && contourObjects.length) {
        const elapsed = (now - startTime) / 1000;

        // Phase 1: Progressive drawing
        const drawProgress = Math.min(elapsed / DRAW_DURATION, 1);
        const count = contourObjects.length;

        contourObjects.forEach((item, index) => {
            const start = (index / count) * 0.72;
            const duration = 0.28;
            const lineProgress = THREE.MathUtils.clamp((drawProgress - start) / duration, 0, 1);
            const drawCount = Math.floor(item.vertexCount * lineProgress);

            if (lineProgress > 0 && !item.soundPlayed) {
                const normElev = (item.elevation - minElevVal) / (maxElevVal - minElevVal || 1);
                playContourNote(normElev, index);
                item.soundPlayed = true;
            }

            item.strokes.forEach(strokeData => {
                strokeData.geometry.setDrawRange(0, drawCount);
            });
        });

        // Phase 2: Camera tilt
        const tiltProgress = THREE.MathUtils.clamp((elapsed - DRAW_DURATION) / TILT_DURATION, 0, 1);
        if (tiltProgress > 0 && !tiltSoundTriggered) {
            playTiltSwoosh();
            tiltSoundTriggered = true;
        }

        const tiltEased = 1 - Math.pow(1 - tiltProgress, 3);
        const currentZoom = THREE.MathUtils.lerp(0.38, 1.0, drawProgress);

        const cameraStartHeight = sceneBoundingSize * 2;
        const eyeLevelY = mountainCentreHeight * 0.4;
        const camDistanceZ = sceneBoundingSize * 1.8;

        const posY = THREE.MathUtils.lerp(cameraStartHeight, eyeLevelY, tiltEased);
        const posZ = THREE.MathUtils.lerp(0, camDistanceZ, tiltEased);

        camera.position.set(0, posY, posZ);
        camera.up.set(0, tiltEased, THREE.MathUtils.lerp(-1, 0, tiltEased)).normalize();
        camera.lookAt(0, mountainCentreHeight * 0.65, 0);

        const viewScale = THREE.MathUtils.lerp(1.0, 1.8, tiltEased);
        const aspect = window.innerWidth / window.innerHeight;

        camera.left = -baseViewSize * aspect * viewScale / 2;
        camera.right = baseViewSize * aspect * viewScale / 2;
        camera.top = baseViewSize * viewScale / 2;
        camera.bottom = -baseViewSize * viewScale / 2;
        camera.zoom = currentZoom;
        camera.updateProjectionMatrix();

        // Phase 3: Reduce vertical exaggeration
        const unexaggerateProgress = THREE.MathUtils.clamp((elapsed - DRAW_DURATION - TILT_DURATION) / UNEXAGGERATE_DURATION, 0, 1);
        if (unexaggerateProgress > 0 && !flattenSoundTriggered) {
            playFlattenTick();
            flattenSoundTriggered = true;
        }

        if (unexaggerateProgress > 0) {
            const scaleEased = 1 - Math.pow(1 - unexaggerateProgress, 3);
            const currentExaggeration = THREE.MathUtils.lerp(INITIAL_VERTICAL_EXAGGERATION, 1.0, scaleEased);

            contourObjects.forEach(item => {
                item.strokes.forEach(strokeData => {
                    const posAttr = strokeData.geometry.attributes.position;
                    const posArray = posAttr.array;
                    const baseArray = strokeData.basePositions;

                    for (let i = 0; i < posAttr.count; i++) {
                        posArray[i * 3 + 1] = baseArray[i * 3 + 1] * currentExaggeration;
                    }
                    posAttr.needsUpdate = true;
                });
            });
        }

        // Phase 4: Final 3x zoom
        const zoomProgress = THREE.MathUtils.clamp((elapsed - DRAW_DURATION - TILT_DURATION - UNEXAGGERATE_DURATION) / ZOOM_DURATION, 0, 1);
        if (zoomProgress > 0 && !zoomSoundTriggered) {
            playZoomChime();
            zoomSoundTriggered = true;
        }

        const zoomEased = 1 - Math.pow(1 - zoomProgress, 3);
        const targetZoom = THREE.MathUtils.lerp(currentZoom, currentZoom * 3.0, zoomEased);

        camera.zoom = targetZoom;
        camera.updateProjectionMatrix();

        // Phase 5: Continuous rotation & Music Box playback
        const totalPhaseDuration = DRAW_DURATION + TILT_DURATION + UNEXAGGERATE_DURATION + ZOOM_DURATION;
        if (elapsed >= totalPhaseDuration) {
            const rotationTime = elapsed - totalPhaseDuration;
            mountain.rotation.y = rotationTime * 0.25;

            updateContourMusic(rotationTime);
        }

        // Status messages
        if (drawProgress < 1) {
            status.textContent = 'DRAWING CONTOURS...';
        } else if (tiltProgress < 1) {
            status.textContent = 'TILTING TO SEA LEVEL VIEW...';
        } else if (unexaggerateProgress < 1) {
            status.textContent = 'REDUCING VERTICAL EXAGGERATION TO 1:1 SCALE...';
        } else if (zoomProgress < 1) {
            status.textContent = 'ZOOMING IN (3X MAGNIFICATION)...';
        } else if (!animationFinished) {
            animationFinished = true;
            status.textContent = 'PEAK // 3X ZOOM 1:1 SCALE COMPLETE';
        }
    }

    renderer.render(scene, camera);
}

requestAnimationFrame(animate);

// ================================================
// URL HASH & UI EVENTS
// ================================================

function loadFromHash() {
    const position = readHash();
    if (position) {
        CENTER = { lat: position.lat, lon: position.lng };
    } else {
        CENTER = { ...DEFAULT_CENTER };
    }
    updateDropdownSelection();
    build().catch(error => {
        console.error(error);
        status.textContent = 'ERROR: ' + error.message;
    });
}

locationSelect.addEventListener('change', (e) => {
    const [lat, lon] = e.target.value.split(',').map(Number);
    location.hash = `${lat},${lon}`;
});

soundToggle.addEventListener('click', () => {
    initAudio();
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
        soundToggle.textContent = 'SOUND: ON';
        soundToggle.classList.add('active');
    } else {
        soundToggle.textContent = 'SOUND: OFF';
        soundToggle.classList.remove('active');
    }
});

document.getElementById('restart').addEventListener('click', replayAnimation);
window.addEventListener('hashchange', loadFromHash);

window.addEventListener('resize', () => {
    const aspect = window.innerWidth / window.innerHeight;
    camera.left = -baseViewSize * aspect / 2;
    camera.right = baseViewSize * aspect / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial load check - Always default to Mount Fuji
if (!location.hash) {
    location.hash = `${DEFAULT_CENTER.lat},${DEFAULT_CENTER.lon}`;
} else {
    loadFromHash();
}

</script>
